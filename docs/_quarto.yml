format:
  html:
    theme: journal
    css: styles.css
    fontsize: 0.9em
    title-prefix: "SGMAP"
    code-copy: true
    syntax-highlighting: ayu
    code-line-numbers: true
    lightbox: true
    link-external-icon: true
    toc: true
    toc-depth: 4
    toc-title: Contents



