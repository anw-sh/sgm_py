            href: scripts/kraken.qmd
          - text: MetaPhlAn
            href: scripts/mpa.qmd
  page-footer: 
    left: "&copy; Anwesh | <script>document.write(new Date().getFullYear());</script>"
    center: 
      - icon: github
        href: https://github.com/anw-sh/sgm_py
