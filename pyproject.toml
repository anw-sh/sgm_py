[tool.pytest.ini_options]
pythonpath = ["src/sgm_py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "G"]
ignore = ["SIM108"]  # an if/else block reads better than a long conditional f-string

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-third-party = ["common", "get_info", "study_runner", "generate_qc_reports", "run_bbduk", "run_fastp", "run_hostile", "run_qc_sg", "run_kraken", "run_mpa", "run_taxonomy", "run_pipeline"]
